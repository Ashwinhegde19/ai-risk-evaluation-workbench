# =============================================================================
# AI Risk Evaluation Workbench — Configuration Template
# =============================================================================
# Copy this file and adjust to your environment. API keys are NEVER stored here:
# only the NAME of the environment variable that holds the key is recorded, and
# the value is resolved at runtime via os.getenv(...).
#
# You can reference environment variables anywhere in this file using the
# syntax ${VAR_NAME} or ${VAR_NAME:-default_value}. They are substituted before
# the config is parsed. Example:
#     api_key_env: OPENAI_API_KEY
#     base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
# =============================================================================

# Default model used when none is explicitly specified.
default_model: gpt-4o

# -----------------------------------------------------------------------------
# EU AI Act declared use case (legal class)
# -----------------------------------------------------------------------------
# Risk class comes from this purpose, NEVER from eval scores.
# A bias or jailbreak finding does not turn a chatbot into Annex III high-risk.
# Valid values: gpai_or_chatbot, customer_support, synthetic_media,
# education, employment, credit, law_enforcement, annex_iii_other,
# social_scoring, manipulation, realtime_remote_biometric,
# emotion_workplace_or_education, minimal
# system_use_case: gpai_or_chatbot

# -----------------------------------------------------------------------------
# Frontier-vs-open comparison targets
# -----------------------------------------------------------------------------
# Ordered list of model slugs evaluated in a comparison run. Namespaced slugs
# (provider/model) route to the Kilo gateway; 'qwen3-8b' routes to the
# self-deployed Modal L4 endpoint (OPEN_MODEL_BASE_URL).
target_models:
  - openai/gpt-5              # frontier, via Kilo
  - anthropic/claude-opus-4.1 # frontier, via Kilo
  - google/gemini-2.5-pro     # frontier, via Kilo
  - deepseek/deepseek-v4-flash # frontier, via Kilo
  - qwen3-8b                  # open-source, via Modal L4 (self-deployed)
# qwen3-8b is self-deployed on Modal.com L4 GPU (24 GB VRAM)
# deepseek-v4-flash is the .env FRONTIER_MODEL / JUDGE_MODEL (Kilo slug).

# -----------------------------------------------------------------------------
# Model backends
# -----------------------------------------------------------------------------
# Each entry is keyed by a model identifier used throughout the workbench.
models:
  gpt-4o:
    name: gpt-4o
    provider: openai            # one of: openai | anthropic | local
    api_key_env: OPENAI_API_KEY # name of the env var holding the key (NOT the key)
    base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    default_temperature: 0.7
    max_tokens: 2048

  claude-sonnet:
    name: claude-sonnet
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
    default_temperature: 0.7
    max_tokens: 2048

  # Local models run via Hugging Face transformers. Provide a model_path
  # (HF repo id or local directory). No API key is required.
  local:
    name: local
    provider: local
    model_path: ${OSS_MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}
    default_temperature: 0.7
    max_tokens: 2048

  # Self-deployed open-source target on Modal.com (L4 GPU, 24 GB VRAM), served
  # by vLLM as an OpenAI-compatible endpoint. Routed by slug in get_backend();
  # base_url + key resolve from OPEN_MODEL_BASE_URL / OPEN_MODEL_API_KEY.
  qwen3-8b:
    name: qwen3-8b
    provider: openai
    api_key_env: OPEN_MODEL_API_KEY
    base_url: ${OPEN_MODEL_BASE_URL:-}
    default_temperature: 0.7
    max_tokens: 2048

# -----------------------------------------------------------------------------
# LLM-as-Judge ensemble
# -----------------------------------------------------------------------------
# Token budget for judge scoring calls. Judges emit a small JSON object plus a
# short reasoning; a too-low budget truncates the JSON mid-response (no closing
# brace), which the ensemble now salvages but is best avoided. On a parse
# failure the ensemble retries once at retry_max_tokens before dropping a vote.
judge:
  max_tokens: 2048
  retry_max_tokens: 4096

# -----------------------------------------------------------------------------
# Evaluation suites
# -----------------------------------------------------------------------------
eval_suites:
  full:
    name: full
    description: Full multi-dimensional safety evaluation suite.
    dimensions:
      - hallucination
      - bias
      - toxicity
      - jailbreak_resistance
      - privacy
      - ip_theft
      - harmful_content
    judge_models:
      - gpt-4o
      - claude-sonnet

# -----------------------------------------------------------------------------
# Guardrail policies (per deployment tier)
# -----------------------------------------------------------------------------
# 'production' blocks everything risky; 'testing' only logs violations.
guardrail_policies:
  production:
    name: production
    block_pii: true
    max_toxicity: 0.7
    block_injection: true
    log_only: false
  testing:
    name: testing
    block_pii: false
    max_toxicity: 0.9
    block_injection: false
    log_only: true
