name: Eval Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: "Model identifier to evaluate"
        required: false
        default: "mock-gpt"
      suite:
        description: "Eval suite identifier"
        required: false
        default: "full"

# Allow the job to post PR comments and read/commit the score history.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Frontend render check for the VERDICT console (web/). Independent of the
  # Python job above: it needs only Node + jsdom and reads the tracked
  # results/*.json fixtures, so a frontend regression fails on its own check
  # without touching the eval pipeline's semantics or blocking it.
  render-check:
    name: VERDICT console render check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Depth 1 is enough: the harness renders the committed results/*.json
          # fixtures and never reads git history (unlike the score-history job).
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No `cache: npm` on purpose: the lockfile may not be committed yet,
          # and setup-node's cache errors out when it is missing, which would
          # turn a missing lockfile into a red build for the wrong reason.

      - name: Install jsdom
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Render check (headless jsdom)
        run: npm run check:render

  evaluate:
    name: Evaluate model & detect regressions
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the score-history baseline can be committed back.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install only the dependencies the pipeline and tests require. The
      # pipeline runs in --mock mode (deterministic, network-free), so the
      # heavy ML packages (torch/transformers) are intentionally not needed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2,<2.11" pyyaml pytest
          # Light-but-not-blind: pure-python wheels that keep the report/PDF,
          # Cline-routing and Mistral suites runnable (still no torch).
          pip install "httpx[http2]>=0.27" "reportlab>=4.0" "mistralai>=1.0"

      - name: Run test suite
        # Scope to the platform under test (src/). The ignored files exercise
        # the deprecated Chainlit app's top-level evals/ + reports/ pipeline
        # (need pandas / matplotlib / python-dotenv) or the Streamlit dashboard
        # (needs streamlit), which this intentionally-light install omits
        # (no torch/transformers either). The new platform's coverage lives in
        # test_redteam_*, test_report_generate, test_reports, test_regression, etc.
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_judge.py \
            --ignore=tests/test_regression_evals.py \
            --ignore=tests/test_report.py \
            --ignore=tests/test_dashboard.py

      - name: Run evaluation pipeline (mock, offline)
        id: eval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MODEL="${{ github.event.inputs.model || 'mock-gpt' }}"
          SUITE="${{ github.event.inputs.suite || 'full' }}"
          python -m src.pipeline.run \
            --model "$MODEL" \
            --suite "$SUITE" \
            --mock \
            --history data/scores_history.json \
            --report-dir results \
            --post-comment

      # Upload the generated compliance report (JSON + PDF), certificate, and
      # the updated score history for inspection / cross-run regression.
      - name: Upload report & certificate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            results/
            data/scores_history.json
          if-no-files-found: warn

      # On pushes to main, persist the updated score history so the next run
      # can detect regressions against it. The default GITHUB_TOKEN does not
      # re-trigger workflows, so this will not cause a CI loop.
      - name: Persist score history baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/scores_history.json || true
          if git diff --cached --quiet; then
            echo "No score-history changes to commit."
          else
            git commit -m "ci(pipeline): update score history baseline"
            git push
          fi
