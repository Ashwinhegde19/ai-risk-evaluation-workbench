name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hugging-face-space
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Import smoke test
        # Ensure the app module imports cleanly. A broken import (e.g. from
        # dependency drift) must fail the build before any deployment happens.
        run: |
          python - <<'PY'
          import importlib
          # app.py starts Chainlit callbacks at import time; importing the
          # orchestration layer pinpoints core wiring without booting the server.
          for module in ("assistant.core", "assistant.guardrails",
                         "evals.claim_verification", "evals.policy_inference",
                         "models.factory"):
              importlib.import_module(module)
          print("Import smoke test passed.")
          PY

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Hugging Face client
        run: python -m pip install "huggingface_hub==1.24.0"

      - name: Sync repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ashwinhegde19/ai-risk-evaluation-workbench
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os

          from huggingface_hub import HfApi

          source_sha = os.environ["SOURCE_SHA"]
          source_repository = os.environ["SOURCE_REPOSITORY"]

          result = HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              folder_path=".",
              path_in_repo=".",
              ignore_patterns=[".github", ".github/*", ".github/**"],
              delete_patterns="*",
              commit_message=f"Deploy GitHub commit {source_sha[:7]}",
              commit_description=(
                  f"Source: https://github.com/{source_repository}/commit/{source_sha}"
              ),
          )
          print(result)
          PY
